<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // FIX: "Cannot set property fetch of #<Window> which has only a getter"
      // This happens when polyfills try to overwrite read-only fetch in some environments.
      // We handle this by aliasing 'formdata-polyfill' to an empty module in vite.config.ts,
      // but we also provide a global variable shim here for other packages.
      (function() {
        if (typeof global === 'undefined') {
          window.global = window;
        }
      })();
    </script>
    <title>Prexious Vouge | Luxury Fashion Heritage</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
